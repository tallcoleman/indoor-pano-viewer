[project]
name = "indoor-pano-viewer-api"
version = "0.1.0"
description = "API for the indoor 360 tour app"
readme = "../README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.121",
    "markdown-it-py>=4.0",
    "nh3>=0.3",
    "pillow>=12.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.12",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.20",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
    "coverage>=7.11",
    "httpx2>=2.12.0",
    "mypy>=1.18",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "testcontainers[postgres]>=4.14",
    "time-machine>=2.19",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --strict-markers"
filterwarnings = [
    "error",
    # Raised inside starlette's own module body; nothing this repo can change.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
]
